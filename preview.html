<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LunRollHistory - window preview</title>
<style>
  :root{
    --accent:#e585ce;
    --window:#0b0810; --sidebar:#110b16; --header:#0e0a13;
    --panel:#180f21; --panel-hover:#211830; --row:#140e1b; --row-alt:#191224;
    --border:#2b2137; --border-soft:#1e1727;
    --text:#ffffff; --dim:#9c93a8; --faint:#6f6579;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#07050a;font-family:"Segoe UI",Arial,Helvetica,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px}
  .caption{color:#6f6579;font-size:12px}
  .caption b{color:#9c93a8;font-weight:600}
  .swatches{display:flex;gap:8px;align-items:center}
  .swatches button{width:22px;height:22px;border:1px solid var(--border-soft);
       background:none;cursor:pointer;padding:2px}
  .swatches button span{display:block;width:100%;height:100%}
  .swatches button.on{border-color:#fff}

  .window{width:940px;height:640px;background:var(--window);
       border:1px solid var(--border);display:grid;
       grid-template-columns:218px 1fr;grid-template-rows:1fr;
       color:var(--text);font-size:13px;position:relative}

  /* sidebar */
  .side{background:var(--sidebar);border-right:1px solid var(--border);
        display:flex;flex-direction:column;padding:22px 0 16px}
  .brand{display:flex;align-items:center;gap:10px;padding:0 20px;margin-bottom:26px}
  .mark{width:41px;height:46px;object-fit:contain;display:block}
  .word{font-size:14px;font-weight:600;line-height:1.15}
  .word small{display:block;color:var(--faint);font-size:10px;font-weight:400;margin-top:2px}
  .section{color:var(--accent);font-size:11px;letter-spacing:.09em;padding:0 20px;margin:10px 0 6px}
  .nav{display:block;width:100%;height:34px;line-height:34px;padding-left:18px;
       color:var(--dim);font-size:12.5px;border:0;background:none;text-align:left;
       cursor:pointer;position:relative}
  .nav:hover{background:rgba(255,255,255,.025)}
  .nav.on{background:rgba(255,255,255,.04);color:#fff}
  .nav.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
  .sidefoot{margin-top:auto;padding:0 20px;color:var(--faint);font-size:10px;line-height:1.5}

  /* main */
  .main{display:flex;flex-direction:column;min-width:0}
  .head{height:96px;background:var(--header);border-bottom:1px solid var(--border);
        padding:26px 28px;position:relative;overflow:hidden}
  .wash{position:absolute;top:0;right:0;width:400px;height:96px;
        background:linear-gradient(to right,transparent,var(--accent));opacity:.07}
  .washline{position:absolute;top:60px;right:24px;width:180px;height:2px;background:var(--accent);opacity:.5}
  .head h1{font-size:24px;font-weight:600;letter-spacing:.2px}
  .head p{color:var(--dim);font-size:11.5px;margin-top:6px}
  .x{position:absolute;z-index:5;top:10px;right:10px;width:30px;height:30px;background:var(--panel);
     border:1px solid var(--border-soft);color:var(--dim);cursor:pointer;font-size:15px}
  .x:hover{background:var(--panel-hover);color:#fff}

  .tabs{height:32px;margin:0 24px;border-bottom:1px solid var(--border-soft);display:flex}
  .tab{height:32px;min-width:64px;padding:0 13px;background:none;border:0;color:var(--dim);
       font-size:12.5px;cursor:pointer;position:relative}
  .tab.on{color:#fff}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}

  .content{flex:1;margin:14px 24px;overflow:hidden;display:flex;flex-direction:column}
  .colhead{display:grid;grid-template-columns:70px 256px 140px 110px 1fr;
       color:var(--faint);font-size:10px;letter-spacing:.08em;padding:0 4px 6px;
       border-bottom:1px solid var(--border-soft)}
  .colhead span:last-child{text-align:right;padding-right:10px}
  .rows{overflow-y:auto;flex:1}
  .rows::-webkit-scrollbar{width:3px}
  .rows::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25)}
  .r{display:grid;grid-template-columns:70px 256px 140px 110px 1fr;height:26px;
     align-items:center;padding:0 4px;font-size:12px;background:var(--row)}
  .r:nth-child(even){background:var(--row-alt)}
  .r .t{color:var(--faint);font-size:11px}
  .r .k{color:var(--dim);font-size:11px}
  .r .v{text-align:right;padding-right:10px}
  .r .v.won{color:var(--accent)}
  .pass{color:#7a7186}
  .epic{color:#a335ee}.rare{color:#0070dd}

  /* settings variant */
  .setrow{background:var(--row);padding:11px 14px;margin-bottom:6px;
          display:flex;align-items:center;justify-content:space-between;gap:20px}
  .setrow .lbl{font-size:12.5px}
  .setrow .dsc{color:var(--faint);font-size:11px;margin-top:4px;max-width:520px;line-height:1.4}
  .sw{width:42px;height:20px;background:#423b4a;border:1px solid var(--border-soft);
      position:relative;flex:0 0 auto;cursor:pointer}
  .sw i{position:absolute;top:2px;left:3px;width:16px;height:14px;background:rgba(255,255,255,.92)}
  .sw.on{background:var(--accent);opacity:.85}
  .sw.on i{left:auto;right:3px}

  .foot{height:54px;background:var(--header);border-top:1px solid var(--border);
        display:flex;align-items:center;padding:0 20px;gap:10px}
  .btn{height:28px;padding:0 16px;background:var(--panel);border:1px solid var(--border-soft);
       color:#fff;font-size:12px;cursor:pointer}
  .btn:hover{background:var(--panel-hover)}
  .btn.primary{border-color:var(--accent)}
  .btn.danger{color:#e67070}
  .spacer{flex:1}
</style>
</head>
<body>

<div class="swatches">
  <span class="caption">Accent:</span>
  <button class="on" data-c="#e585ce"><span style="background:#e585ce"></span></button>
  <button data-c="#7a9cf2"><span style="background:#7a9cf2"></span></button>
  <button data-c="#80d96f"><span style="background:#80d96f"></span></button>
  <button data-c="#f2925a"><span style="background:#f2925a"></span></button>
  <button data-c="#ad79f2"><span style="background:#ad79f2"></span></button>
  <button data-c="#73dae0"><span style="background:#73dae0"></span></button>
  <span class="caption" style="margin-left:14px">Page:</span>
  <button class="pg on" data-p="history" style="width:auto;padding:0 10px;color:#9c93a8;font-size:11px">History</button>
  <button class="pg" data-p="capture" style="width:auto;padding:0 10px;color:#9c93a8;font-size:11px">Settings</button>
  <button class="pg" data-p="appearance" style="width:auto;padding:0 10px;color:#9c93a8;font-size:11px">Appearance</button>
</div>

const CLASSC={PALADIN:"#f58cba",ROGUE:"#fff569",PRIEST:"#ffffff",MAGE:"#40c7eb"};

const settings = [
  ["Capture group loot rolls","Reads the client's loot history, so every player's roll is recorded without anyone else installing this addon.",true],
  ["Capture manual /roll","Parses roll results out of the system chat channel for guilds that run rolls by hand.",true],
  ["Capture loot awards","Records who actually received each item, which is not always who won the roll.",true],
  ["Capture roll windows","Logs the moment a Need/Greed window opens. Useful for items that never resolve.",true],
  ["Only record while grouped","Ignores everything looted while solo.",false],
];

function historyPage(){
  let h = '<div class="colhead"><span>TIME</span><span>ITEM</span><span>PLAYER</span><span>TYPE</span><span>ROLL</span></div><div class="rows">';
  for(let i=0;i<4;i++) for(const r of rolls){
    const col = CLASSC[r[4]] || "#9c93a8";
    h += `<div class="r"><span class="t">${r[0]}</span>`
      +  `<span class="${r[2]}" style="${r[2]?'':'color:#6f6579'}">${r[1]}</span>`
      +  `<span style="color:${col}">${r[3]}</span>`
      +  `<span class="k ${r[5]==='Pass'?'pass':''}">${r[5]}</span>`
      +  `<span class="v ${r[7]?'won':''}">${r[6]}</span></div>`;
  }
  return h + '</div>';
}
function capturePage(){
  let h = "";
  for(const s of settings){
    h += `<div class="setrow"><div><div class="lbl">${s[0]}</div><div class="dsc">${s[1]}</div></div>`
      +  `<div class="sw ${s[2]?'on':''}"><i></i></div></div>`;
  }
  h += `<div class="setrow"><div><div class="lbl">History size</div>`
    +  `<div class="dsc">Oldest entries are dropped past this. Import to SQLite regularly and the database outlives the window.</div></div>`
    +  `<div style="display:flex;align-items:center;gap:12px"><div style="width:170px;height:4px;background:#2e2438;position:relative">`
    +  `<div style="position:absolute;left:0;top:0;height:4px;width:64px;background:var(--accent)"></div>`
    +  `<div style="position:absolute;left:58px;top:-4px;width:12px;height:12px;background:#fff"></div></div>`
    +  `<span style="font-size:12px">20000</span></div></div>`;
  return h;
}

    <div class="dsc">Left click opens the ledger, right click jumps to capture settings, drag moves it around the ring.</div></div>
    <div class="sw on"><i></i></div></div>`;
}

const PAGES = {
  history:{title:"Roll History",sub:"Every roll this client has witnessed, newest first.",tabs:true,html:historyPage},
  capture:{title:"Capture Settings",sub:"What gets written to the ledger.",tabs:false,html:capturePage},
  appearance:{title:"Appearance",sub:"Colours and type for this window.",tabs:false,html:appearancePage},
};

function render(key){
  const p = PAGES[key];
  document.getElementById("title").textContent = p.title;
  document.getElementById("sub").textContent = p.sub;
  document.getElementById("tabs").style.display = p.tabs ? "flex" : "none";
  document.getElementById("content").innerHTML = p.html();
  document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.nav===key));
  document.querySelectorAll(".pg").forEach(n=>n.classList.toggle("on",n.dataset.p===key));
}

document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
  document.documentElement.style.setProperty("--accent",b.dataset.c);
  const hx=document.getElementById("hex"); if(hx) hx.textContent=b.dataset.c.slice(1).toUpperCase();
  document.querySelectorAll("[data-c]").forEach(o=>o.classList.remove("on"));
  b.classList.add("on");
});
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{
  if(PAGES[b.dataset.nav]) render(b.dataset.nav);
});
document.querySelectorAll(".pg").forEach(b=>b.onclick=()=>render(b.dataset.p));
document.querySelectorAll("#tabs .tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll("#tabs .tab").forEach(o=>o.classList.remove("on"));
  t.classList.add("on");
});
render("history");
</script>
</body>
</html>
